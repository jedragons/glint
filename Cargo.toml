[workspace]
resolver = "3"
members = [
    "sources/bindgen",
    "sources/lua-defgen",
]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
glint-bindgen = { path = "./sources/bindgen/" }

anyhow = "1.0.104"
lazy_static = "1.5.1"
scopeguard = "1.2.0"
tree-sitter = "=0.27.2"
tree-sitter-c = "=0.24.2"
walkdir = "2.5.0"
